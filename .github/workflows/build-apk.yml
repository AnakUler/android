name: Build XAUUSD News Intelligence APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'xauusd_news_intelligence/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test backend
        working-directory: xauusd_news_intelligence/worker
        run: |
          npm install
          npm test
          npm run typecheck

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: xauusd_news_intelligence/android
        run: gradle assembleDebug

      - name: Run Android unit tests
        working-directory: xauusd_news_intelligence/android
        run: gradle testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-news-debug-apk
          path: xauusd_news_intelligence/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish public APK prerelease
        if: startsWith(github.event.head_commit.message, 'Publish APK asset')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug-${{ github.sha }}
          name: XAUUSD News Intelligence debug APK ${{ github.sha }}
          body: Automated debug APK build. Firebase and Cloudflare configuration is still required for push notifications.
          prerelease: true
          make_latest: false
          files: xauusd_news_intelligence/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
